name: update nvfetcher

on:
  schedule:
    - cron: 0 21 * * *
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Restore nvfetcher cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nvfetcher
          key: nvfetcher-${{ github.run_id }}
          restore-keys: nvfetcher-

      - name: Update each package as its own commit
        run: |
          mkdir -p /tmp/nvfetcher-changes
          touch /tmp/nvfetcher-failures
          mapfile -t PACKAGES < <(grep -oP '^\[\K[^\]]+' nvfetcher.toml)

          for pkg in "${PACKAGES[@]}"; do
            changes_file="/tmp/nvfetcher-changes/${pkg}"

            if ! nix run nixpkgs#nvfetcher -- -f "^${pkg}\$" -l "$changes_file"; then
              echo "::warning::$pkg failed to update, skipping"
              echo "- $pkg failed to update" >> /tmp/nvfetcher-failures
              rm -f "$changes_file"
              continue
            fi

            if [ ! -s "$changes_file" ]; then
              continue
            fi

            if ! ./update.sh "$changes_file"; then
              echo "::warning::update.sh failed for $pkg, skipping"
              echo "- $pkg: update.sh failed" >> /tmp/nvfetcher-failures
              rm -f "$changes_file"
              git checkout -- _sources pkgs/vendorHashes.json
              continue
            fi

            git add _sources/generated.nix _sources/generated.json pkgs/vendorHashes.json
            if ! git diff --cached --quiet; then
              git commit -F "$changes_file"
            fi
          done

          cat /tmp/nvfetcher-changes/* > /tmp/nvfetcher-changes-all 2>/dev/null || true
          touch /tmp/nvfetcher-changes-all

      - name: Update flake inputs
        run: |
          nix flake update 2> /tmp/flake-changes || { cat /tmp/flake-changes; exit 1; }
          grep -A 2 '^•' /tmp/flake-changes > /tmp/flake-changes.tmp || true
          mv /tmp/flake-changes.tmp /tmp/flake-changes

      - name: Commit flake changes
        run: |
          git add flake.lock
          if [ -s /tmp/flake-changes ] && ! git diff --cached --quiet; then
            git commit -F /tmp/flake-changes
          fi

      - name: Build PR body
        run: |
          {
            echo '## Changes:'
            cat /tmp/nvfetcher-changes-all
            cat /tmp/flake-changes
            if [ -s /tmp/nvfetcher-failures ]; then
              echo '## Warnings:'
              cat /tmp/nvfetcher-failures
            fi
          } > /tmp/pr-body

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: nvfetcher-update
          title: "chore: update packages"
          body-path: /tmp/pr-body
          delete-branch: true
